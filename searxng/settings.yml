use_default_settings: true

server:
  # Valore di default documentato da SearXNG stesso — SearXNG gira solo in locale/Docker,
  # quindi non è una credenziale reale. Da sostituire con `openssl rand -hex 32` se mai
  # esposto su una rete non fidata.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  default_lang: "it-IT"
  formats:
    - html
    - json

ui:
  static_use_hash: false
  default_theme: simple

engines:
  - name: google
    disabled: false
    weight: 2
  - name: bing
    disabled: false
    weight: 1
  - name: duckduckgo
    disabled: false
    weight: 1
