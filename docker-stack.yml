#Ecco i comandi, da eseguire su ~/bandi-monitor (il clone da cui gira lo stack Tailscale) dopo aver fatto push dal clone dev:
#
#  cd ~/bandi-monitor
#  git pull
#  mvn clean package -DskipTests
#  docker compose up -d --build app
#
#Spiegazione rapida:
#  1. git pull — porta le ultime modifiche pushate.
#  2. mvn clean package -DskipTests — ricompila il jar.
#  3. docker compose up -d --build app — ricostruisce e riavvia solo il container app (db/ollama/searxng restano su, nessuna interruzione per loro).
#
#Per verificare che sia tornato su:
#  curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8080
#  HTTP 200 = tutto ok.

services:
  app:
    image: bandi-monitor:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/bandi_monitor
      DB_USERNAME: bandi_monitor
      DB_PASSWORD: bandi_monitor
      OLLAMA_URL: http://ollama:11434
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    depends_on:
      - db
      - ollama

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bandi_monitor
      POSTGRES_USER: bandi_monitor
      POSTGRES_PASSWORD: bandi_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  pgdata:
  ollama_data:
